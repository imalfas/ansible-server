---
# tasks file for my_custom_role_1
# roles/file_creator/tasks/main.yml
- name: Ensure target directory exists
  ansible.builtin.file:
    path: /tmp/my_folder
    state: directory
    mode: '0755'

- name: Create a sample text file
  ansible.builtin.copy:
    content: "This file was automatically created by an Ansible role.\n"
    dest: /tmp/my_folder/output.txt
    mode: '0644'
